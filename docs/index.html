    : micBlocked
      ? `<button class="btn primary wide" data-act="rec">Choose a recording for ${esc(S.short)}</button>
         <p class="muted small">The microphone isn't available on this page. Record ${v.need > 1 ? "at least 45 seconds" : "at least 15 seconds"} with your phone's voice recorder, in the position above, then choose the file. ${v.need > 1 ? "It's split into 3 takes automatically." : ""}</p>`
      : `<button class="btn primary wide" data-act="rec">Record take ${v.ti + 1} of ${v.need} (${TAKE_S} s)</button>`;
  const optional = !S.required ? `<button class="btn ghost" data-act="skipstate">Skip this one</button>` : "";
  $app.innerHTML = header("car-or-home") + `
  <div class="panel">
    <span class="label">${esc(car.name)}</span>
    <h2>${titles[v.mode]}</h2>
    <ul class="steps">${steps}</ul>
  </div>
  <div class="panel">
    <h3>${esc(S.label)}</h3>
    <p>${esc(S.how)}</p>
    <p class="muted small">Phone: ${car.position === "hood" ? "the same spot in the engine bay as always, screen up, away from the fan and belts." : "in its dashboard holder, as always."} Stay quiet, close the doors and windows, and turn off the radio.</p>
    <div class="rec" id="recbox" hidden>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="ringfg" cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="8" stroke-dasharray="276.5" stroke-dashoffset="276.5" stroke-linecap="round"/></svg>
        <div class="center"><span class="big mono" id="ringtxt">15</span><span class="muted small">seconds</span></div></div>
      <div class="lvl" aria-label="Sound level"><i id="lvl"></i></div>
    </div>
    <div id="recmsg"></div>
    ${demoBtns}${recBtn}
    <div class="row">${optional}</div>
    ${safety}
  </div>`;
}
async function doRecord(fault) {
  const v = view, s = v.states[v.si];
  const msg = document.getElementById("recmsg"), box = document.getElementById("recbox");
  document.querySelectorAll("[data-act=rec],[data-act=demorec],[data-act=skipstate]").forEach(b => b.disabled = true);
  let takes = [];
  try {
    if (v.car.demo) {
      takes = [synthEngine(s, TAKE_S + 1, 7919 * (v.si + 1) + 104729 * (v.ti + 1) + (v.mode === "baseline" ? 0 : Date.now() % 100000), fault || null)];
    } else if (micBlocked) {
      const x = await pickFile();
      const need = v.need - v.ti, len = (TAKE_S + 1) * SR;
      if (x.length < Math.min(len, 11 * SR)) throw new Error("That recording is too short. Record at least 15 seconds.");
      for (let i = 0; i < need && (i + 1) * len <= x.length + SR; i++) takes.push(x.subarray(i * len, Math.min(x.length, (i + 1) * len)));
    } else {
      box.hidden = false;
      const ring = document.getElementById("ringfg"), txt = document.getElementById("ringtxt"), lvl = document.getElementById("lvl");
      takes = [await recordLive(TAKE_S + 1, p => { ring.style.strokeDashoffset = 276.5 * (1 - p); txt.textContent = Math.ceil((1 - p) * (TAKE_S + 1)); },
                                 r => { lvl.style.width = Math.min(100, 100 * Math.sqrt(r) * 2.2) + "%"; })];
    }
  } catch (e) {
    if (!v.car.demo && !micBlocked && (e.name === "NotAllowedError" || e.name === "SecurityError" || e.name === "NotFoundError" || e.name === "TypeError")) {
      micBlocked = true; render(); return;
    }
    msg.innerHTML = `<p class="note">${esc(e.message || "Recording failed. Try again.")}</p>`;
    document.querySelectorAll("[data-act=rec],[data-act=demorec],[data-act=skipstate]").forEach(b => b.disabled = false);
    return;
  }
  v.takes[s] = (v.takes[s] || []).concat(takes);
  v.ti = v.takes[s].length;
  if (v.mode !== "baseline" && v.car.demo) v.fault = fault || "";
  advance();
}
function advance() {
  const v = view, s = v.states[v.si];
  if ((v.takes[s]?.length || 0) < v.need) { render(); return; }
  v.si++; v.ti = 0;
  if (v.si >= v.states.length) return finishRecording();
  render();
}
function skipState() { const v = view; v.si++; v.ti = 0; if (v.si >= v.states.length) return finishRecording(); render(); }
async function finishRecording() {
  const v = view, car = v.car;
  if (v.mode === "baseline") {
    if (!v.takes.idle?.length) { v.si = 0; render(); return; }
    go({name: "train", car, takes: v.takes, p: 0, msg: "Starting"});
    try {
      const model = await trainBaseline(car, v.takes, (p, msg) => { const bar = document.getElementById("trainbar"), m = document.getElementById("trainmsg"); if (bar) bar.style.width = (100 * p) + "%"; if (m) m.textContent = msg; });
      if (!saveModel(car.id, model)) throw new Error("This browser couldn't save the baseline (storage is full or blocked). Free some space or use a normal browser window.");
      car.trained = true; car.trainedAt = model.trainedAt; car.detectors = model.ae ? 2 : 1; saveCars();
      go({name: "car", id: car.id, flash: "Baseline saved. Run a check whenever you like, in the same spot and conditions."});
    } catch (e) { go({name: "car", id: car.id, flash: e.message, flashBad: true}); }
    return;
  }
  const model = modelOf(car.id), states = {};
  for (const s of v.states) if (v.takes[s]?.length) states[s] = scoreState(car, model, s, v.takes[s][0]);
  if (v.mode === "calibrate") {
    let added = 0;
    for (const [s, r] of Object.entries(states)) if (r.feat) { addToPool(model, s, r); added++; }
    saveModel(car.id, model);
    go({name: "car", id: car.id, flash: added ? "Healthy recording added. The alarm levels now include today's sound." : "Nothing was added: the recording couldn't be compared. Try again."});
    return;
  }
  const verdict = worst(Object.values(states).map(r => r.verdict));
  const entry = {t: Date.now(), verdict, demoFault: v.fault, states: Object.fromEntries(Object.entries(states).map(([s, r]) => [s, {
    verdict: r.verdict, why: r.why || null, reasons: r.reasons || [], rpm: r.rpm ? Math.round(r.rpm) : null,
    feat: r.feat ? {scores: r.feat.scores.map(x => +x.toFixed(3)), median: +r.feat.median.toFixed(3)} : null,
    ae: r.ae ? {scores: r.ae.scores.map(x => +x.toFixed(4)), median: +r.ae.median.toFixed(4)} : null}]))};
  car.history = (car.history || []).concat(entry).slice(-50); saveCars();
  go({name: "result", id: car.id, at: entry.t});
}
function addToPool(model, s, r) {
  const cap = a => a.slice(-300);
  if (r.feat) model.pool.feat[s] = cap((model.pool.feat[s] || []).concat(r.feat.scores));
  if (r.ae) model.pool.ae[s] = cap((model.pool.ae[s] || []).concat(r.ae.scores));
  refreshThresholds(model);
}
function renderTrain() {
  const v = view;
  $app.innerHTML = header() + `
  <div class="panel"><span class="label">${esc(v.car.name)}</span><h2>Learning the healthy sound</h2>
    <div class="prog"><i id="trainbar"></i></div><p class="muted" id="trainmsg">Starting</p>
    <p class="muted small">This takes under a minute on most phones. Keep this page open.</p>
    ${hasTF() ? "" : `<p class="note">The learning library didn't load (no internet?). Only the feature check will be used. Re-record the baseline later for the full check.</p>`}
  </div>`;
}
function meterRow(name, d) {
  if (!d || !d.thr) return "";
  const max = Math.max(d.thr.alarm * 1.35, d.median * 1.1), pct = v => Math.min(100, 100 * v / max);
  const cls = d.median > d.thr.alarm ? "bad" : d.median > d.thr.warn ? "warn" : "";
  return `<span>${name}</span><div class="bar" role="img" aria-label="${name}: ${d.median.toFixed(2)}, warning at ${d.thr.warn.toFixed(2)}"><i class="${cls}" style="width:${pct(d.median)}%"></i><b style="left:${pct(d.thr.warn)}%"></b><b style="left:${pct(d.thr.alarm)}%"></b></div><span class="mono muted">${(d.median / d.thr.warn).toFixed(2)}×</span>`;
}
function renderResult() {
  const car = cars.find(c => c.id === view.id), e = car.history.find(h => h.t === view.at), model = modelOf(car.id);
  const [h, sub] = VERDICT_TEXT[e.verdict];
  const blocks = Object.entries(e.states).map(([s, r]) => {
    const feat = r.feat && {median: r.feat.median, thr: model.thr.feat[s]}, ae = r.ae && {median: r.ae.median, thr: model.thr.ae[s]};
    return `<div class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(STATES[s].label)}</h3>${pill(r.verdict)}</div>
      ${r.why ? `<p class="note">${esc(r.why)}</p>` : ""}
      ${r.reasons.length ? `<ul class="reasons">${r.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : (r.verdict === "ok" ? `<p class="muted">No differences stood out.</p>` : "")}
      ${r.rpm ? `<p class="muted small">Estimated engine speed from the sound: <span class="mono">${r.rpm}</span> rpm${model.rpm[s]?.m ? ` (healthy: <span class="mono">${Math.round(model.rpm[s].m)}</span>)` : ""}</p>` : ""}
      ${feat || ae ? `<details><summary>Detector scores</summary><div class="meter" style="margin-top:10px">${meterRow("Sound pattern", ae)}${meterRow("Feature check", feat)}</div>
      <p class="muted small" style="margin-top:8px">Bars show the median score against this car's warning level (first mark) and alarm level (second mark). 1.00× is the warning level.</p></details>` : ""}
    </div>`;
  }).join("");
  $app.innerHTML = header("car") + `
  <div class="verdict ${e.verdict === "retry" ? "none" : e.verdict}"><span class="label">${esc(car.name)} · ${fmtDate(e.t)}${e.demoFault !== undefined && car.demo ? ` · demo: ${esc(e.demoFault || "healthy")}` : ""}</span><h1>${esc(h)}</h1><p>${esc(sub)}</p></div>
  ${blocks}
  <div class="row">${e.verdict !== "ok" && e.verdict !== "retry" && !e.markedNormal ? `<button class="btn" data-act="marknormal">It's fine, mark as normal</button>` : ""}<button class="btn primary" data-act="car">Done</button></div>
  ${e.markedNormal ? `<p class="muted small">You marked this check as normal. Its sound now counts as healthy when setting the alarm levels.</p>` : `<p class="muted small">If a mechanic confirms nothing is wrong, mark it as normal. Engine Ear then widens its idea of "healthy" a little.</p>`}`;
}
function markNormal() {
  const car = cars.find(c => c.id === view.id), e = car.history.find(h => h.t === view.at), model = modelOf(car.id);
  for (const [s, r] of Object.entries(e.states)) if (r.feat) addToPool(model, s, {feat: {scores: r.feat.scores}, ae: r.ae ? {scores: r.ae.scores} : null});
  e.markedNormal = true; saveModel(car.id, model); saveCars(); render();
}
function renderCar(id) {
  const car = cars.find(c => c.id === id); if (!car) return go({name: "home"});
  const model = car.trained ? modelOf(id) : null;
  if (car.trained && !model) { car.trained = false; saveCars(); }
  const v = lastVerdict(car), last = car.history?.[car.history.length - 1];
  const hist = (car.history || []).slice().reverse().map(h => `<tr data-act="openresult" data-at="${h.t}" style="cursor:pointer"><td class="mono" style="white-space:nowrap">${fmtDate(h.t)}</td><td class="small muted">${Object.keys(h.states).map(s => STATES[s].short).join(", ")}${h.markedNormal ? ` <span class="muted small">(marked normal)</span>` : ""}</td><td style="text-align:right">${pill(h.verdict)}</td></tr>`).join("");
  const nCal = model ? Math.max(...Object.values(model.pool.feat).map(a => a.length)) : 0;
  $app.innerHTML = header("home") + `
  ${view.flash ? `<p class="note ${view.flashBad ? "" : "info"}">${esc(view.flash)}</p>` : ""}
  <div class="verdict ${model ? (v === "retry" ? "none" : v) : "none"}">
    <span class="label">${esc(car.name)} · ${car.cylinders}-cyl ${esc(car.fuel)} · idle ${car.idleRpm} rpm</span>
    <h1>${model ? esc(VERDICT_TEXT[v][0]) : "Needs a healthy recording"}</h1>
    <p>${model ? (last ? "Last check " + fmtDate(last.t) + "." : "Baseline ready. Run your first check.") : "Record the engine while it's healthy, so later checks have something to compare with."}</p>
  </div>
  ${model ? `<div class="row"><button class="btn primary" data-act="check">Run a check</button><button class="btn" data-act="calibrate">Add a healthy recording</button></div>
    <p class="muted small">Tip: on another day, while the car is still fine, tap <b>Add a healthy recording</b> once. Alarm levels set from two different days give far fewer false alarms.</p>` :
    `<button class="btn primary wide" data-act="baseline">Record the healthy sound</button>`}
  ${hist ? `<div class="panel"><h3>Checks</h3><div class="tabwrap"><table class="hist">${hist}</table></div></div>` : ""}
  ${model ? `<div class="panel"><h3>Baseline</h3>
    <p class="small">Recorded ${fmtDate(model.trainedAt)}: ${model.states.map(s => STATES[s].label).join(", ")}. Detectors: ${model.ae ? "sound pattern + feature check" : "feature check only"}. Healthy windows behind the alarm levels: <span class="mono">${nCal}</span>.</p>
    <div class="row"><button class="btn" data-act="baseline">Re-record baseline</button><button class="btn" data-act="export">Save a backup file</button><button class="btn" data-act="import">Restore from backup</button></div>
    <p class="muted small">Re-record after a repair or service that changes the sound (new belt, new exhaust), or if you change phone or phone position.</p></div>` : ""}
  <div class="row"><button class="btn danger" data-act="delete" id="delbtn">Delete this car</button></div>`;
}
/* ---- backup */
async function exportCar(id) {
  const car = cars.find(c => c.id === id), data = JSON.stringify({app: "engine-ear", v: 1, car, model: modelOf(id)});
  const name = `engine-ear-${car.name.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}.json`;
  try {
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({filename: name, data}); return; }
  } catch (e) { /* fall through to a normal download */ }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type: "application/json"})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importCar() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (d.app !== "engine-ear" || !d.car || !d.model) throw new Error();
      cars = cars.filter(c => c.id !== d.car.id); cars.push(d.car); saveCars(); saveModel(d.car.id, d.model);
      delete aeCache[d.car.id];
      go({name: "car", id: d.car.id, flash: "Restored from backup."});
    } catch (e) { go({name: view.name, id: view.id, flash: "That file isn't an Engine Ear backup.", flashBad: true}); }
  };
  inp.click();
}

/* ---------------------------------------------------------------- events */
$app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act, car = view.car || cars.find(c => c.id === view.id);
  if (a === "home") go({name: "home"});
  else if (a === "add") go({name: "add"});
  else if (a === "demo") addDemo();
  else if (a === "open") go({name: "car", id: t.dataset.id});
  else if (a === "car") go({name: "car", id: car.id});
  else if (a === "car-or-home") go(car?.trained ? {name: "car", id: car.id} : {name: "home"});
  else if (a === "baseline") startBaseline(car);
  else if (a === "check") startCheck(car, "check");
  else if (a === "calibrate") startCheck(car, "calibrate");
  else if (a === "rec") doRecord();
  else if (a === "demorec") doRecord(t.dataset.fault);
  else if (a === "skipstate") skipState();
  else if (a === "marknormal") markNormal();
  else if (a === "openresult") go({name: "result", id: car.id, at: +t.dataset.at});
  else if (a === "export") exportCar(car.id);
  else if (a === "import") importCar();
  else if (a === "delete") {
    if (t.dataset.armed) { cars = cars.filter(c => c.id !== car.id); saveCars(); store.del("model." + car.id); delete aeCache[car.id]; go({name: "home"}); }
    else { t.dataset.armed = "1"; t.textContent = "Tap again to delete " + car.name + " and its baseline"; }
  }
});
$app.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) { e.preventDefault(); e.target.click(); } });
if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) micBlocked = true;
if (hasTF()) { tf.setBackend("webgl").catch(() => tf.setBackend("cpu")); }
render();
window.EngineEar = {synthEngine, analyse, scoreState, trainBaseline, describe};   // for tests
</script>
